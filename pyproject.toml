[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "captcha-solver"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.135.3",
    "numpy>=2.4.4",
    "scikit-learn>=1.2.2",
    "python-multipart>=0.0.22",
    "streamlit>=1.50.0",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
    "tqdm>=4.67.3",
    "onnx>=1.21.0",
]

[project.scripts]
fastapi = "fastapi_dev:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
exclude = ["captcha_data*", "logs*", "*.egg-info*", ".git*"]

[tool.setuptools.package-data]
# package-level data moved to project root; no package-local data.json
web = [
    "templates/*.html",
    "static/css/*.css",
    "static/js/*.js",
]

[tool.fastapi]
entrypoint = "web.app:app"

[[tool.uv.index]]
url = "https://pypi.org/simple"

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu130"

[dependency-groups]
dev = [
    "python-lsp-server>=1.14.0",
]
