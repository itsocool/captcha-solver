[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "captcha-solver"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "fastapi[standard]>=0.135.3",
    "hypercaptcha",
    "numpy>=2.4.4",
    "onnx>=1.21.0",
    "onnxruntime>=1.28.0",
    "pandas>=3.0.2",
    "pillow>=12.2.0",
    "pydantic-settings>=2.13.1",
    "python-multipart>=0.0.22",
    "scikit-learn>=1.2.2",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
    "tqdm>=4.67.3",
]

[tool.setuptools]
include-package-data = true
# 라이브러리/학습 스크립트는 모두 hypercaptcha 패키지에 있다. 루트에는 배포할 모듈이 없다.
packages = [
    "web",
    "web.api",
    "web.api.v1",
    "web.core",
    "web.frontend",
    "web.schemas",
    "web.services",
]

[tool.setuptools.package-dir]
web = "apps/web"

[tool.setuptools.package-data]
web = [
    "templates/*.html",
    "static/*.ico",
    "static/js/*.js",
    "static/vendor/*.js",
]

[tool.fastapi]
entrypoint = "web.app:app"

[[tool.uv.index]]
url = "https://pypi.org/simple"

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu130"

[tool.uv.workspace]
members = [
    "packages/python_3.12/captcha_solver",
    "packages/python_3.12/hyperCaptcha",
]

[tool.uv.sources]
hypercaptcha = { workspace = true }

[dependency-groups]
dev = [
    "python-lsp-server>=1.14.0",
]
