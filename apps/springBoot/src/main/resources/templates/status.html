<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout :: page('Model Status', 'Model Status · Hyper Captcha Solver', ~{:: content}, ~{})}">
<body>

<div th:fragment="content">
	<div class="mb-6 grid gap-4 sm:grid-cols-3">
		<div class="rounded-2xl border border-border bg-card p-5">
			<p class="text-sm text-muted-foreground">로드된 모델</p>
			<p class="mt-1 text-2xl font-semibold">
				<span th:text="${loadedCount}">4</span>
				<span class="text-base font-normal text-muted-foreground" th:text="'/ 서비스 대상 ' + ${servicedCount}">/ 서비스 대상 4</span>
			</p>
			<p class="mt-1 text-xs text-muted-foreground" th:text="'등록된 캡차 ' + ${#lists.size(models)} + '종'">등록된 캡차 6종</p>
		</div>
		<div class="rounded-2xl border border-border bg-card p-5">
			<p class="text-sm text-muted-foreground">디바이스</p>
			<p class="mt-1 text-2xl font-semibold" th:text="${device}">cpu</p>
		</div>
		<div class="rounded-2xl border border-border bg-card p-5">
			<p class="text-sm text-muted-foreground">기본 Captcha ID</p>
			<p class="mt-1 text-2xl font-semibold" th:text="${defaultCaptchaId}">supreme_court</p>
			<p class="mt-1 text-xs text-muted-foreground"
				th:text="'설정 출처: ' + (${configSource == 'db'} ? 'DB (service_captchas)' : '설정 폴백')">설정 출처: DB (service_captchas)</p>
		</div>
	</div>

	<div class="grid gap-6 md:grid-cols-2 xl:grid-cols-3">
		<div th:each="model : ${models}" class="rounded-2xl border bg-card p-6"
			th:classappend="${model.serviced} ? 'border-border' : 'border-dashed border-border opacity-70'">
			<div class="flex items-start justify-between gap-3">
				<div class="flex items-center gap-3">
					<span class="flex size-11 items-center justify-center rounded-xl"
						th:classappend="${model.loaded} ? 'bg-brand-soft text-brand' : 'bg-background text-muted-foreground'">
						<svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
							<rect x="3" y="3" width="18" height="18" rx="2"></rect>
							<path d="M9 3v18M3 9h6M3 15h6"></path>
						</svg>
					</span>
					<div>
						<p class="font-semibold" th:text="${model.name}">대법원</p>
						<p class="font-mono text-xs text-muted-foreground"
							th:text="${model.captchaId} + ' · rev ' + ${model.rev}">supreme_court · rev 0</p>
					</div>
				</div>
				<div class="flex flex-col items-end gap-1">
					<span class="rounded-full px-2.5 py-1 text-xs font-medium"
						th:classappend="${model.loaded} ? 'bg-success-soft text-success' : 'bg-warning-soft text-warning'"
						th:text="${model.loaded} ? 'Loaded' : 'Not loaded'">Loaded</span>
					<span th:if="${model.serviced}" class="rounded-full bg-brand-soft px-2.5 py-1 text-xs font-medium text-brand">서비스 대상</span>
					<span th:if="${model.captchaId == defaultCaptchaId}" class="rounded-full border border-border px-2.5 py-1 text-xs font-medium text-muted-foreground">기본값</span>
				</div>
			</div>

			<dl class="mt-5 space-y-2.5 text-sm">
				<div class="flex justify-between gap-3">
					<dt class="text-muted-foreground">디바이스</dt>
					<dd class="font-medium" th:text="${model.device}">cpu</dd>
				</div>
				<div class="flex justify-between gap-3">
					<dt class="text-muted-foreground">이미지 크기</dt>
					<dd class="font-medium" th:text="${model.imageSize}">120×40</dd>
				</div>
				<div class="flex justify-between gap-3">
					<dt class="text-muted-foreground">레이블 길이</dt>
					<dd class="font-medium" th:text="${model.labelLength}">6</dd>
				</div>
				<div class="flex justify-between gap-3">
					<dt class="text-muted-foreground">문자 수</dt>
					<dd class="font-medium" th:text="${model.charCount}">10</dd>
				</div>
				<div class="flex justify-between gap-3">
					<dt class="text-muted-foreground">가중치 파일</dt>
					<dd class="font-medium" th:text="${model.modelSizeMb != null} ? ${model.modelSizeMb} + ' MB' : '없음'">8.8 MB</dd>
				</div>
				<div th:if="${model.modelMtime != null}" class="flex justify-between gap-3">
					<dt class="text-muted-foreground">갱신</dt>
					<dd class="font-medium" th:text="${model.modelMtime}">2026-08-06 17:00</dd>
				</div>
			</dl>

			<p th:if="${!model.loaded or !model.serviced}"
				class="mt-4 rounded-lg bg-background p-3 font-mono text-xs break-words text-muted-foreground"
				th:text="${model.state}">not serviced</p>
		</div>
	</div>
</div>

</body>
</html>
