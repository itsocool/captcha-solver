<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hyper OCR</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Noto Sans KR for improved Korean rendering -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --teal: #0d9488;
      --teal-2: #14b8a6;
      --teal-50: #e6fffb;
      --nav-bg: #ffffff;
      --nav-text: rgba(0, 0, 0, 0.8);
    }

    /* dropzone color tokens (overridden in dark mode) */
    :root {
      --drop-bg: #ffffff;
      --drop-text: rgba(0, 0, 0, 0.65);
      --drop-accent: var(--teal);
    }

    /* fixed-top navbar 사용에 따라 상단 패딩을 증가시킵니다 */
    body {
      padding-top: 80px;
      background: linear-gradient(180deg, #fbffff, #f7fffe);
      font-family: 'Noto Sans KR', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial;
    }

    /* navbar 스타일 (테마에 따라 색상이 바뀝니다) */
    nav.navbar {
      background: var(--nav-bg);
      color: var(--nav-text);
      transition: background .12s ease, color .12s ease;
    }

    nav.navbar .navbar-brand,
    nav.navbar .nav-link {
      color: var(--nav-text);
    }

    nav.navbar .nav-link.active {
      color: var(--teal) !important;
      font-weight: 600
    }

    .preview-img {
      max-width: 100%;
      max-height: 220px;
      object-fit: contain;
      border: 1px solid var(--teal-2);
      padding: 6px;
      border-radius: 6px;
      background: #fff
    }

    /* Dropzone look */
    #dropzone {
      background: var(--drop-bg);
      color: var(--drop-text);
      transition: background .15s ease, color .12s ease;
    }

    #dropzone .bi {
      color: var(--drop-accent);
    }

    .border-dashed {
      border-style: dashed !important;
    }

    #dropzone.dragover {
      background: var(--teal-50);
      box-shadow: 0 4px 12px rgba(13, 148, 136, 0.06);
    }

    #dropFilename {
      color: rgba(0, 0, 0, 0.6);
    }

    .monospace {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, 'Roboto Mono', 'Helvetica Neue', monospace;
    }

    .btn-teal {
      background-color: var(--teal);
      border-color: var(--teal);
      color: #fff
    }

    .btn-teal:hover,
    .btn-teal:focus {
      background-color: var(--teal-2);
      border-color: var(--teal-2);
    }

    .card.border-teal {
      border: 1px solid rgba(13, 148, 136, 0.15);
    }

    .card .card-title {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .icon-circle {
      width: 36px;
      height: 36px;
      display: inline-grid;
      place-items: center;
      border-radius: 50%;
      background: var(--teal);
      color: #fff
    }

    .bg-teal-soft {
      background: var(--teal-50);
      border-radius: 6px;
      padding: 6px
    }

    .spinner-teal {
      color: var(--teal)
    }

    /* Result card improvements for better visibility */
    .result-card {
      border-left: 4px solid var(--teal);
      box-shadow: 0 6px 18px rgba(13, 148, 136, 0.06);
      background: linear-gradient(180deg, #ffffff, #fbfffe);
    }

    .result-card .card-body {
      padding: 0.75rem 1rem;
    }

    .predicted-text {
      font-size: 1.15rem;
      color: #0b6a63;
    }

    .confidence-badge {
      font-weight: 700;
    }

    .result-card img.img-thumbnail {
      border: 1px solid rgba(13, 148, 136, 0.08);
    }

    .result-card:hover {
      transform: translateY(-3px);
      transition: transform .12s ease-out;
    }

    /* Dark mode overrides (applied when body[data-theme="dark"]) */
    body[data-theme="dark"] {
      background: linear-gradient(180deg, #071919, #052625);
      color: #e6fffb
    }

    /* dark-mode 토큰: navbar 배경/문자색 포함 */
    body[data-theme="dark"] {
      --drop-bg: #052625;
      --drop-text: rgba(230, 255, 251, 0.95);
      --drop-accent: #14b8a6;
      --nav-bg: #052625;
      --nav-text: rgba(230, 255, 251, 0.95);
    }

    body[data-theme="dark"] .card {
      background: #072624;
      color: #d7fff6
    }

    body[data-theme="dark"] .card.border-teal {
      border-color: rgba(20, 184, 166, 0.12)
    }

    body[data-theme="dark"] .preview-img {
      border-color: rgba(20, 184, 166, 0.18);
      background: #052625
    }

    body[data-theme="dark"] .btn-teal {
      background-color: #0ebaa6;
      border-color: #0ebaa6
    }

    body[data-theme="dark"] .bg-teal-soft {
      background: rgba(20, 184, 166, 0.08);
    }

    body[data-theme="dark"] .result-card {
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);
    }

    /* Gemini 스타일 */
    .gemini-chat {
      width: 100%;
    }

    .gemini-header .gemini-avatar {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      background: #0b6a63;
      color: #fff;
      font-weight: 700;
    }

    .gemini-messages {
      max-height: 420px;
      overflow: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .gemini-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .gemini-row.user {
      justify-content: flex-end;
    }

    .gemini-row.user .gemini-bubble {
      background: var(--teal);
      color: #fff;
      border-radius: 12px 12px 8px 12px;
      align-self: flex-end;
    }

    .gemini-row.assistant {
      justify-content: flex-start;
    }

    .gemini-row.assistant .gemini-bubble {
      background: #f1f5f4;
      color: #063c36;
      border-radius: 12px 12px 12px 8px;
      align-self: flex-start;
    }

    .gemini-bubble {
      padding: 10px 12px;
      max-width: 78%;
      word-break: break-word;
      box-shadow: 0 4px 12px rgba(2, 10, 8, 0.04);
    }

    .gemini-meta {
      font-size: 12px;
      color: #6b6b6b;
      margin-top: 6px;
    }

    .gemini-input-row {
      margin-top: 12px;
    }

    .gemini-input {
      min-height: 56px;
      resize: vertical;
      border-radius: 10px;
    }

    body[data-theme="dark"] .gemini-row.assistant .gemini-bubble {
      background: rgba(255, 255, 255, 0.03);
      color: #d7fff6;
    }
  </style>
</head>

<body>
  <!-- 상단 고정 네비게이션 바: 브랜드 + 메뉴 (Captcha / OCR / Chat) + 테마 토글 버튼 -->
  <nav class="navbar navbar-expand-lg navbar-light fixed-top shadow-sm">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="#">
        <span class="icon-circle"><i class="bi bi-chat-dots-fill"></i></span>
        <span class="fw-bold">Hyper Chat bot</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#topNav"
        aria-controls="topNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="topNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" aria-current="page" href="/captcha" id="nav-captcha">Captcha</a></li>
          <li class="nav-item"><a class="nav-link active" href="#" id="nav-chat">Chat</a></li>
        </ul>
        <div class="d-flex align-items-center">
          <!-- Theme toggle button moved to navbar (ID 유지) -->
          <button id="themeBtn" class="btn btn-sm btn-outline-secondary ms-2" title="Toggle theme">
            <i id="themeIcon" class="bi bi-circle-half"></i>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8">
        <div class="card shadow-sm border-teal">
          <div class="card-body">
            <h3 class="card-title mb-3">
              <span class="icon-circle"><i class="bi bi-chat-dots-fill"></i></span>
              Hyper Chat
            </h3>

            <!-- Chat UI -->
            <div class="gemini-chat">
              <!-- <div class="gemini-header d-flex align-items-center gap-3 mb-2">
                <div class="gemini-avatar d-flex align-items-center justify-content-center">G</div>
                <div>
                  <div class="h6 mb-0">LLM</div>
                  <div class="small text-muted">대화형 AI</div>
                </div>
                <div class="ms-auto">
                  <span class="badge bg-teal-soft text-teal">모드: 채팅</span>
                </div>
              </div> -->

              <div id="geminiMessages" class="gemini-messages mb-2" aria-live="polite" aria-atomic="false">
                <!-- 메시지 행이 JS로 추가됩니다 -->
              </div>

              <div class="gemini-input-row d-flex gap-2 align-items-end">
                <textarea id="geminiInput" class="form-control gemini-input" rows="2"
                  placeholder="메시지를 입력하세요... (Enter 전송, Shift+Enter 줄바꿈)"></textarea>
                <div class="d-flex flex-column align-items-end">
                  <button id="geminiSend" class="btn btn-teal mb-1" title="Send"><i
                      class="bi bi-send-fill"></i></button>
                  <small id="geminiStatus" class="text-muted small">Ready</small>
                </div>
              </div>

              <div id="spinner" class="spinner-border ms-auto mt-2 d-none spinner-teal" role="status"><span
                  class="visually-hidden">Loading...</span></div>

              <style>
                /* Gemini 스타일 */
                .gemini-chat {
                  width: 100%;
                }

                .gemini-header .gemini-avatar {
                  width: 44px;
                  height: 44px;
                  border-radius: 8px;
                  background: #0b6a63;
                  color: #fff;
                  font-weight: 700;
                }

                .gemini-messages {
                  max-height: 420px;
                  overflow: auto;
                  padding: 8px;
                  display: flex;
                  flex-direction: column;
                  gap: 10px;
                }

                .gemini-row {
                  display: flex;
                  gap: 10px;
                  align-items: flex-start;
                }

                .gemini-row.user {
                  justify-content: flex-end;
                }

                .gemini-row.user .gemini-bubble {
                  background: var(--teal);
                  color: #fff;
                  border-radius: 12px 12px 8px 12px;
                  align-self: flex-end;
                }

                .gemini-row.assistant {
                  justify-content: flex-start;
                }

                .gemini-row.assistant .gemini-bubble {
                  background: #f1f5f4;
                  color: #063c36;
                  border-radius: 12px 12px 12px 8px;
                  align-self: flex-start;
                }

                .gemini-bubble {
                  padding: 10px 12px;
                  max-width: 78%;
                  word-break: break-word;
                  box-shadow: 0 4px 12px rgba(2, 10, 8, 0.04);
                }

                .gemini-meta {
                  font-size: 12px;
                  color: #6b6b6b;
                  margin-top: 6px;
                }

                .gemini-input-row {
                  margin-top: 12px;
                }

                .gemini-input {
                  min-height: 56px;
                  resize: vertical;
                  border-radius: 10px;
                }

                body[data-theme="dark"] .gemini-row.assistant .gemini-bubble {
                  background: rgba(255, 255, 255, 0.03);
                  color: #d7fff6;
                }
              </style>
            </div>
            <!-- /Chat UI -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Theme handling: light / dark / auto
    const THEME_KEY = 'theme-mode'; // values: 'light' | 'dark' | 'auto'
    const themeBtn = document.getElementById('themeBtn');
    const themeIcon = document.getElementById('themeIcon');

    function applyTheme(mode) {
      if (mode === 'auto') {
        // follow system
        const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.body.setAttribute('data-theme', isDark ? 'dark' : 'light');
      } else {
        document.body.setAttribute('data-theme', mode);
      }
      updateIcon(mode);
    }

    function updateIcon(mode) {
      themeIcon.className = '';
      if (mode === 'light') themeIcon.classList.add('bi', 'bi-sun-fill');
      else if (mode === 'dark') themeIcon.classList.add('bi', 'bi-moon-fill');
      else themeIcon.classList.add('bi', 'bi-circle-half');
    }

    function cycleTheme() {
      const cur = localStorage.getItem(THEME_KEY) || 'auto';
      const order = ['light', 'dark', 'auto'];
      let next = order[(order.indexOf(cur) + 1) % order.length];
      localStorage.setItem(THEME_KEY, next);
      applyTheme(next);
    }

    // initialize theme on load
    (function () {
      const saved = localStorage.getItem(THEME_KEY) || 'auto';
      applyTheme(saved);
      // if auto, listen to system changes
      if (window.matchMedia) {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
          const mode = localStorage.getItem(THEME_KEY) || 'auto';
          if (mode === 'auto') applyTheme('auto');
        });
      }
    })();

    themeBtn.addEventListener('click', cycleTheme);

    // Chat interaction JS (uses Gemini-style classes)
    (function () {
      const messagesEl = document.getElementById('geminiMessages');
      const inputEl = document.getElementById('geminiInput');
      const sendBtn = document.getElementById('geminiSend');
      const statusEl = document.getElementById('geminiStatus');
      const spinner = document.getElementById('spinner');

      function makeRow(role, text) {
        const row = document.createElement('div');
        row.className = 'gemini-row ' + (role === 'user' ? 'user' : 'assistant');
        const bubble = document.createElement('div');
        bubble.className = 'gemini-bubble';
        bubble.textContent = text;
        const meta = document.createElement('div');
        meta.className = 'gemini-meta';
        meta.textContent = (role === 'user' ? 'You' : '챗봇') + ' · ' + new Date().toLocaleTimeString();
        const wrapper = document.createElement('div');
        wrapper.appendChild(bubble);
        wrapper.appendChild(meta);
        row.appendChild(wrapper);
        return row;
      }

      function appendMessage(role, text) {
        const row = makeRow(role, text);
        messagesEl.appendChild(row);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      async function send() {
        const text = inputEl.value.trim();
        if (!text) return;
        appendMessage('user', text);
        inputEl.value = '';
        statusEl.textContent = '전송중...';
        spinner.classList.remove('d-none');
        sendBtn.disabled = true;
        try {
          const resp = await fetch('/api/v1/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text })
          });
          let reply = '';
          if (resp.ok) {
            // 기대: { reply: "..." } 또는 { message: "..." }
            const data = await resp.json();
            reply = data.reply ?? data.message ?? data.answer ?? JSON.stringify(data);
          } else {
            reply = `오류: ${resp.status} ${resp.statusText}`;
          }
          appendMessage('assistant', reply || '(응답 없음)');
          statusEl.textContent = '응답 완료';
        } catch (e) {
          appendMessage('assistant', '요청 실패: ' + e.message);
          statusEl.textContent = '오류';
        } finally {
          spinner.classList.add('d-none');
          sendBtn.disabled = false;
          setTimeout(() => statusEl.textContent = 'Ready', 1200);
        }
      }

      sendBtn.addEventListener('click', send);
      inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      });

      // 초기 환영 메시지
      appendMessage('assistant', '안녕하세요. LLM 기반 챗봇입니다. 무엇을 도와드릴까요?');
    })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
