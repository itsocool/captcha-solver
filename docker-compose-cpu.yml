# CPU 서빙용. docker-compose.yml 과 다른 점은 build.dockerfile / image 태그 / 이름뿐이다.
#   docker compose -f docker-compose-cpu.yml up -d --build
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    image: captcha-solver:cpu
    container_name: captcha-solver-web-cpu
    # Dockerfile.cpu 의 CMD 는 fastapi run(리로드 없음)이라 개발 서버가 아니다.
    # GPU 쪽과 동시에 띄울 일이 있으면 여기 호스트 포트를 바꾼다.
    ports:
      - "30008:8000"
    # 호스트 .env 를 런타임에 주입한다. 있으면 그 값이 쓰이고, 없으면 컨테이너는
    # apps/web/core/config.py 의 필드 기본값으로 뜬다 (.env 는 gitignore 대상이라
    # 없을 수 있으므로 required: false — Compose v2.24+ 필요).
    # 이미지에는 굽지 않으므로 값을 바꾸면 재빌드 없이 재기동만 하면 된다.
    env_file:
      - path: .env
        required: false
    # 여기에 environment 를 추가하면 .env 보다 우선한다. 특정 값을 배포 환경에
    # 고정해야 할 때만 쓴다.
    #
    # 기본 캡차는 환경 변수로 못 정한다. db/schema.sql 의
    # service_captchas.is_default 를 옮겨야 바뀐다 (DB 값이 항상 우선).
    volumes:
      # 학습 UI(/train)가 여기 model/ 에 가중치를 쓰므로 :ro 로 두면 저장에서 죽는다.
      - ./captcha_data:/app/captcha_data
    # SQLite(/app/db/captchaSolver.sqlite3)는 기동할 때마다 schema.sql + 시드로 새로
    # 만들어지는 휘발성 데이터다. 컨테이너 재생성 후에도 service_captchas 수정분을
    # 남기려면 DB 를 이미지 밖 경로로 빼고 그 경로에만 볼륨을 붙여야 한다:
    #   environment: - DB_PATH=/data/captchaSolver.sqlite3
    #   volumes:     - captcha_db:/data
    # (/app/db 에 직접 볼륨을 붙이면 안 된다. 빈 볼륨이 이미지의 schema.sql/시드를
    #  한 번 복사한 뒤로는 갱신되지 않아 스키마 변경이 반영되지 않는다.)
    restart: unless-stopped
networks:
  default:
    name: captcha-solver-cpu-net
