services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: captcha-solver:latest
    container_name: captcha-solver-web
    # 호스트 30008 -> 컨테이너 8000 (fastapi dev). 개발 서버라 30008 로 노출한다.
    ports:
      - "30008:8000"
    # 개발 서버 자동 리로드를 실제로 쓰려면 소스를 마운트한다(.venv 는 가리지 않게 소스만):
    #   volumes:
    #     - ./apps:/app/apps
    #     - ./packages:/app/packages
    # 호스트 .env 를 런타임에 주입한다. 있으면 그 값이 쓰이고, 없으면 컨테이너는
    # apps/web/core/config.py 의 필드 기본값으로 뜬다 (.env 는 gitignore 대상이라
    # 없을 수 있으므로 required: false — Compose v2.24+ 필요).
    # 이미지에는 굽지 않으므로 값을 바꾸면 재빌드 없이 재기동만 하면 된다.
    env_file:
      - path: .env
        required: false
    # 여기에 environment 를 추가하면 .env 보다 우선한다. 특정 값을 배포 환경에
    # 고정해야 할 때만 쓴다.
    #
    # 기본 캡차는 환경 변수로 못 정한다. db/schema.sql 의
    # service_captchas.is_default 를 옮겨야 바뀐다 (DB 값이 항상 우선).
    volumes:
      # 학습 UI(/train)가 여기 model/ 에 가중치를 쓰므로 :ro 로 두면 저장에서 죽는다.
      - ./captcha_data:/app/captcha_data
    # 이 이미지의 torch 는 CUDA(cu130) 빌드라서 GPU 를 붙여주지 않으면
    # torch.cuda.is_available() 이 False 가 되고 추론이 조용히 CPU 로 떨어진다
    # (/predict 의 CUDA 선택지도 "사용 가능한 GPU 가 없습니다" 로 잠긴다).
    # 호스트에 NVIDIA Container Toolkit(nvidia-container-runtime)이 필요하다.
    # GPU 가 없는 호스트에서는 이 블록이 있으면 기동이 실패하므로
    # docker-compose-cpu.yml 을 쓴다.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # SQLite(/app/db/captchaSolver.sqlite3)는 기동할 때마다 schema.sql + 시드로 새로
    # 만들어지는 휘발성 데이터다. 컨테이너 재생성 후에도 service_captchas 수정분을
    # 남기려면 DB 를 이미지 밖 경로로 빼고 그 경로에만 볼륨을 붙여야 한다:
    #   environment: - DB_PATH=/data/captchaSolver.sqlite3
    #   volumes:     - captcha_db:/data
    # (/app/db 에 직접 볼륨을 붙이면 안 된다. 빈 볼륨이 이미지의 schema.sql/시드를
    #  한 번 복사한 뒤로는 갱신되지 않아 스키마 변경이 반영되지 않는다.)
    restart: unless-stopped
networks:
  default:
    name: captcha-solver-net
