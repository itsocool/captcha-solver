[project]
name = "aso-ai"
version = "0.1.0"
description = "PyTorch CRNN CAPTCHA recognition library"
readme = "README.md"
authors = [
    { name = "th.kim", email = "yesicankor@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.4",
    "onnx>=1.21.0",
    "onnxruntime>=1.28.0",
    "pandas>=3.0.2",
    "pillow>=12.2.0",
    "pydantic>=2.0",
    "scikit-learn>=1.2.2",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
    "tqdm>=4.67.3",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
