[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hypercaptcha"
version = "0.1.0"
description = "PyTorch CRNN 기반 캡챠 인식 라이브러리 및 CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.4",
    "onnx>=1.21.0",
    "pandas>=3.0.2",
    "pillow>=12.2.0",
    "pydantic>=2.0",
    "scikit-learn>=1.2.2",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
    "tqdm>=4.67.3",
]

[project.scripts]
hypercaptcha = "hypercaptcha.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["hypercaptcha*"]
